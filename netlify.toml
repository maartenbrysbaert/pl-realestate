# This is a fully prerendered static site. angular.json sets `outputMode: "static"`,
# so the build emits HTML files only - no server bundle, no SSR functions, no
# runtime. Netlify's Angular runtime plugin auto-installs but has nothing to wire
# up without a server bundle, and every route resolves to a real file on the CDN.
# tools/generate-sitemap.mjs fails the build if a server bundle ever reappears.

[build]
  base = "app"
  command = "npm run build"
  publish = "dist/app/browser"
  # Always build. `base` is app/, but the build also runs tools/generate-sitemap.mjs
  # from the repo root, so skipping builds when nothing under app/ changed would
  # silently ignore changes to the sitemap, the redirect rules and this file.
  # A non-zero exit means "do not ignore".
  ignore = "/bin/false"

[build.environment]
  NODE_VERSION = "22"

# Squarespace served /over with a 200. Netlify's pretty-URL handling would 301
# it to /over/, which puts a redirect hop on every URL Google has already
# indexed and leaves the canonical tag (/over) pointing at a URL that
# immediately redirects. Turning it off keeps the served URL, the canonical and
# the sitemap all spelled the same way.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# ---------------------------------------------------------------- redirects
# Order matters: Netlify applies the first matching rule.

# Squarespace served the homepage at /home as well as /. Keep that URL alive.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/fr/home"
  to = "/fr/"
  status = 301
  force = true

[[redirects]]
  from = "/en/home"
  to = "/en/"
  status = 301
  force = true

# Squarespace Commerce was enabled but unused; the header linked to /cart.
[[redirects]]
  from = "/cart"
  to = "/"
  status = 301
  force = true

# Localised 404s. Without these, a missing /fr/... URL would fall through to the
# Dutch 404 page. No catch-all rewrite: every real route is prerendered to its
# own HTML file, and a catch-all would turn genuine 404s into 200s.
[[redirects]]
  from = "/fr/*"
  to = "/fr/404.html"
  status = 404

[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

# ------------------------------------------------------------------ headers

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # Everything is self-hosted - no third-party scripts, fonts or images - so
    # the policy can be strict. 'unsafe-inline' on styles is required by
    # Angular's component style injection.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# Angular fingerprints these filenames, so they can be cached indefinitely.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image filenames are stable rather than hashed, so give them a shorter life.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
