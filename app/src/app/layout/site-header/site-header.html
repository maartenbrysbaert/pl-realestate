<a class="skip" href="#main" i18n="Skip link">Doorgaan naar inhoud</a>

<header class="header">
  <div class="header__inner">
    <a class="wordmark" routerLink="/" (click)="closeMenu()">{{ site.wordmark }}</a>

    <button
      class="burger"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      (click)="toggleMenu()"
    >
      <span class="burger__label" i18n="Mobile menu button">Menu</span>
      <span class="burger__bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>

    <nav
      class="nav"
      id="primary-nav"
      [class.nav--open]="menuOpen()"
      i18n-aria-label
      aria-label="Hoofdnavigatie"
    >
      <ul class="nav__list">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              (click)="closeMenu()"
              >{{ item.label }}</a
            >
          </li>
        }
      </ul>

      <!--
        Locales are separate prerendered builds, so these must be real document
        navigations. routerLink would keep the current locale's bundle loaded.
      -->
      <div class="lang">
        <button
          class="lang__toggle"
          type="button"
          [attr.aria-expanded]="languageOpen()"
          aria-controls="language-menu"
          (click)="toggleLanguage()"
        >
          <svg class="lang__globe" viewBox="0 0 19 19" aria-hidden="true">
            <path
              fill="currentColor"
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M9.5 18.833C14.4706 18.833 18.5 14.8036 18.5 9.83301C18.5 4.86244 14.4706 0.833008 9.5 0.833008C4.52944 0.833008 0.5 4.86244 0.5 9.83301C0.5 14.8036 4.52944 18.833 9.5 18.833ZM9.91948 16.5409C9.66958 16.8228 9.52553 16.833 9.5 16.833C9.47447 16.833 9.33042 16.8228 9.08052 16.5409C8.83166 16.2602 8.56185 15.797 8.31501 15.1387C7.9028 14.0395 7.60822 12.5409 7.52435 10.833H11.4757C11.3918 12.5409 11.0972 14.0395 10.685 15.1387C10.4381 15.797 10.1683 16.2602 9.91948 16.5409ZM11.4757 8.83301H7.52435C7.60822 7.12511 7.9028 5.62649 8.31501 4.52728C8.56185 3.86902 8.83166 3.40579 9.08052 3.12509C9.33042 2.84323 9.47447 2.83301 9.5 2.83301C9.52553 2.83301 9.66958 2.84323 9.91948 3.12509C10.1683 3.40579 10.4381 3.86902 10.685 4.52728C11.0972 5.62649 11.3918 7.12511 11.4757 8.83301ZM13.4778 10.833C13.3926 12.7428 13.0651 14.4877 12.5576 15.841C12.5122 15.9623 12.4647 16.0817 12.4154 16.1989C14.5362 15.226 16.087 13.2245 16.4291 10.833H13.4778ZM16.4291 8.83301H13.4778C13.3926 6.92322 13.0651 5.17832 12.5576 3.82503C12.5122 3.7037 12.4647 3.58428 12.4154 3.46714C14.5362 4.44001 16.087 6.44155 16.4291 8.83301ZM5.52218 8.83301C5.60742 6.92322 5.93487 5.17832 6.44235 3.82503C6.48785 3.7037 6.53525 3.58428 6.5846 3.46714C4.46378 4.44001 2.91296 6.44155 2.57089 8.83301H5.52218ZM2.57089 10.833C2.91296 13.2245 4.46378 15.226 6.5846 16.1989C6.53525 16.0817 6.48785 15.9623 6.44235 15.841C5.93487 14.4877 5.60742 12.7428 5.52218 10.833H2.57089Z"
            />
          </svg>
          <span>{{ locale.current.label }}</span>
          <svg class="lang__chevron" viewBox="0 0 10 6" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              d="M1 1l4 4 4-4"
            />
          </svg>
        </button>

        <!--
          Always in the DOM, shown/hidden with CSS. Rendering it conditionally
          would keep the sibling-locale links out of the prerendered HTML, so
          crawlers and no-JS visitors would have no way to switch language.
        -->
        <ul class="lang__menu" id="language-menu" [class.is-open]="languageOpen()">
          @for (option of locale.all; track option.code) {
            <li>
              <a
                [href]="locale.urlFor(option)"
                [attr.hreflang]="option.code"
                [attr.lang]="option.code"
                [attr.aria-current]="option.code === locale.current.code ? 'true' : null"
                [class.is-current]="option.code === locale.current.code"
                >{{ option.label }}</a
              >
            </li>
          }
        </ul>
      </div>
    </nav>
  </div>
</header>
